name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      JWT_SECRET_KEY: dummy-jwt-secret-key
      JWT_ISSUER: https://conduit.com
      JWT_SECONDS_TO_EXPIRATION: 86400
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the tests, then type-checks and lints (posttest).
      - run: npm test

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://conduit-staging.denis-coccodi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # JWT_SECRET_KEY is a Worker secret set once with
      # `wrangler secret put JWT_SECRET_KEY --env staging`; it is kept across deploys.
      - run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exercises the deployed API: register, auth, create and read back data.
      - name: Smoke test staging
        run: sh scripts/smoke.sh create https://conduit-staging.denis-coccodi.workers.dev "$RUNNER_TEMP/jar.txt"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # The production environment requires approval before this job starts.
    environment:
      name: production
      url: https://conduit.denis-coccodi.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # JWT_SECRET_KEY is a Worker secret set once with `wrangler secret put`;
      # it is kept across deploys.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production responds
        run: curl -sf -o /dev/null https://conduit.denis-coccodi.workers.dev/api/tags
