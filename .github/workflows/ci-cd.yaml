name: CI/CD

# Pushes to main run the tests and deploy to staging. Any other branch can be
# tested and deployed to staging by hand: Actions → CI/CD → Run workflow →
# pick the branch. Pull requests only run the tests.
# Production is deployed separately: see deploy-production.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      JWT_SECRET_KEY: dummy-jwt-secret-key
      JWT_ISSUER: https://everisefc.com
      JWT_SECONDS_TO_EXPIRATION: 86400
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the tests, then type-checks and lints (posttest).
      - run: npm test

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Runs on pushes to main and on manual runs from any branch. There is one
    # staging Worker shared by all branches: the latest deploy wins. Deploys
    # run one at a time and are never cancelled halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://be-staging.everisefc.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compared after the deploy: a drop means data was lost.
      - name: Count staging data before deploying
        run: echo "ARTICLES_BEFORE=$(sh scripts/count-articles.sh https://be-staging.everisefc.workers.dev)" >> "$GITHUB_ENV"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # JWT_SECRET_KEY is a Worker secret set once with
      # `wrangler secret put JWT_SECRET_KEY --env staging`; it is kept across deploys.
      - run: npx wrangler deploy --env staging --message "${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check staging data survived the deploy
        run: |
          after=$(sh scripts/count-articles.sh https://be-staging.everisefc.workers.dev)
          echo "Articles before: $ARTICLES_BEFORE, after: $after"
          if [ "$after" -lt "$ARTICLES_BEFORE" ]; then
            echo "::error::Staging lost articles in the deploy ($ARTICLES_BEFORE -> $after)."
            exit 1
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Exercises the deployed API: register, auth, create and read back data.
      - name: Smoke test staging
        run: sh scripts/smoke.sh create https://be-staging.everisefc.workers.dev "$RUNNER_TEMP/jar.txt"
        # Staging is behind Cloudflare Access; this service token lets CI through.
        # While the secrets are unset, no Access headers are sent.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Summary
        run: |
          {
            echo "Staging is live at https://be-staging.everisefc.workers.dev with \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`."
            echo
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "To ship this commit to production, open [Deploy production](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yaml) and click **Run workflow**."
            else
              echo "Production only deploys from \`main\`: merge this branch first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
