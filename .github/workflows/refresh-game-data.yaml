name: Refresh game data from XIVAPI

# Started by hand: Actions → Refresh game data from XIVAPI → Run workflow →
# pick the target. Asks the backend to re-download the game data it keeps
# from XIVAPI (duties, roulettes, jobs: POST /api/duties/refresh), then every
# image the site shows from it: duty banners and type icons, job, role and
# Party Finder icons (POST /api/duties/refresh/images, a batch per call),
# and builds the fight planner's action catalog again (POST
# /api/planner/catalog/refresh), warning of actions whose tooltip changed.
# Nothing is deployed.
#
# Needs a DUTIES_REFRESH_KEY secret in each GitHub environment (staging,
# production), equal to the Worker secret of the same name:
#   wrangler secret put DUTIES_REFRESH_KEY              # production
#   wrangler secret put DUTIES_REFRESH_KEY --env staging
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which backend to refresh
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: refresh-game-data-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  refresh:
    # Only the repository owner may run it; for anyone else the job is skipped.
    if: github.actor == 'denis-coccodi'
    runs-on: ubuntu-latest
    # The production environment only accepts main.
    environment: ${{ inputs.target }}
    permissions: {}
    steps:
      - name: Refresh the stored game data and images
        env:
          TARGET: ${{ inputs.target }}
          DUTIES_REFRESH_KEY: ${{ secrets.DUTIES_REFRESH_KEY }}
          # Staging is behind Cloudflare Access; this service token lets CI through.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DUTIES_REFRESH_KEY" ]; then
            echo "::error::DUTIES_REFRESH_KEY is not set in the $TARGET environment's secrets."
            exit 1
          fi
          if [ "$TARGET" = production ]; then
            url=https://apis.everise.dev
          else
            url=https://staging.apis.everise.dev
          fi
          set -- -H "X-Refresh-Key: $DUTIES_REFRESH_KEY"
          if [ "$TARGET" = staging ] && [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            set -- "$@" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          fi

          # POSTs to $1, saving the body to response.json; prints the HTTP status.
          post() {
            path=$1; shift
            curl -s -o response.json -w '%{http_code}' -X POST "$@" "$url$path"
          }
          fail_on() {
            case "$1" in
              200) ;;
              401) echo "::error::The backend rejected the key: the GitHub and Worker DUTIES_REFRESH_KEY secrets differ, or the Worker secret is unset."; exit 1 ;;
              302) echo "::error::Cloudflare Access blocked the request: check the CI service token policy on $TARGET."; exit 1 ;;
              *) echo "::error::$2 failed with HTTP $1."; exit 1 ;;
            esac
          }

          # 1. The game data: duties, roulettes and jobs.
          status=$(post /api/duties/refresh "$@")
          cat response.json; echo
          fail_on "$status" Refresh
          cp response.json refresh.json

          # 2. The images it refers to, a batch per call (a Worker may only
          #    make so many outbound requests per call). A failed batch stays
          #    pending, so it is retried a few times.
          retries=0
          for call in $(seq 1 200); do
            status=$(post /api/duties/refresh/images "$@")
            if [ "$status" != 200 ] && [ "$retries" -lt 3 ]; then
              retries=$((retries + 1))
              echo "Image batch failed with HTTP $status; retrying."
              sleep 10
              continue
            fi
            fail_on "$status" "Image download"
            jq -c . response.json
            [ "$(jq .pending response.json)" = 0 ] && break
          done
          if [ "$(jq .pending response.json)" != 0 ]; then
            echo "::error::Image downloads didn't finish."
            exit 1
          fi
          failed=$(jq -r '.failed | join(", ")' response.json)
          if [ -n "$failed" ]; then
            echo "::warning::XIVAPI has no image for ids $failed."
          fi

          cp response.json images.json

          # 3. The fight planner's action catalog, checked against the tooltips.
          #    A 404 means the planner is switched off on this backend (FEATURES).
          status=$(post /api/planner/catalog/refresh "$@")
          if [ "$status" = 404 ]; then
            echo "::notice::The fight planner is switched off on $TARGET: no catalog to build."
            echo '{"changed":[]}' > catalog.json
          else
            cat response.json; echo
            fail_on "$status" "Catalog refresh"
            cp response.json catalog.json
          fi
          jq -r '.changed[] | "::warning::Fight planner action \(.name) (\(.id)): its tooltip no longer has \(.missing | join(", ")). Check its effects in src/planner/catalog."' catalog.json

          {
            echo "Refreshed **$TARGET** ($url):"
            echo
            jq -r '"- \(.dutyCount) duties, \(.rouletteCount) roulettes, \(.jobCount) jobs (data \(.dataVersion), fetched \(.fetchedAt))"' refresh.json
            jq -r '.groups[] | "  - \(.name): \(.count)"' refresh.json
            jq -r '"- \(.total - (.failed | length)) of \(.total) images downloaded"' images.json
            if [ -n "$failed" ]; then echo "  - Not on XIVAPI: $failed"; fi
            if [ "$status" = 404 ]; then
              echo "- Fight planner: switched off"
            else
              jq -r '"- Fight planner catalog: \(.actionCount) actions, \(.effectCount) with heals or mitigations, \(.changed | length) to check"' catalog.json
              jq -r '.changed[] | "  - \(.name) (\(.id)): \(.missing | join(", "))"' catalog.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
