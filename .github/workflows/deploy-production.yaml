name: Deploy production

# Started by hand: Actions → Deploy production → Run workflow.
# Deploys the latest commit on main, but only if that commit's CI/CD run
# (tests + staging deploy + smoke test) succeeded.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    # The production environment only accepts main: started from any other
    # branch, the job fails before any step runs.
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apis.everise.dev
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check this commit passed staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yaml \
            --commit "$GITHUB_SHA" --event push --status success --limit 1 \
            --json conclusion -q '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Commit ${GITHUB_SHA::7} has no successful CI/CD run (tests + staging). Wait for it to pass, or fix it, before deploying to production."
            exit 1
          fi
          echo "Commit ${GITHUB_SHA::7} passed tests and staging."
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compared after the deploy: a drop means data was lost.
      - name: Count production data before deploying
        run: echo "ARTICLES_BEFORE=$(sh scripts/count-articles.sh https://apis.everise.dev)" >> "$GITHUB_ENV"
      # JWT_SECRET_KEY is a Worker secret set once with `wrangler secret put`;
      # it is kept across deploys.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production responds and kept its data
        run: |
          curl -sf -o /dev/null https://apis.everise.dev/api/tags
          after=$(sh scripts/count-articles.sh https://apis.everise.dev)
          echo "Articles before: $ARTICLES_BEFORE, after: $after"
          if [ "$after" -lt "$ARTICLES_BEFORE" ]; then
            echo "::error::Production lost articles in the deploy ($ARTICLES_BEFORE -> $after). Roll back in the Cloudflare dashboard (be-prod -> Deployments) and investigate."
            exit 1
          fi
