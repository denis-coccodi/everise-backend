# The documentation GitHub Pages builds from this folder. It's served at
# everise.dev/docs/backend/ (this baseurl) by the frontend's Worker, in the
# site's look: the layouts here are copies of the frontend's docs/, and the
# stylesheet is the frontend's. How it fits together: the docs-site skill.
title: Backend docs
description: How the Everise backend works - API, data, features and operations.
baseurl: /docs/backend
repository_name: everise-backend
section: backend
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
plugins:
  - jekyll-relative-links
defaults:
  - scope:
      path: ''
    values:
      layout: docs
