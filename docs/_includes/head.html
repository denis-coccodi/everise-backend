<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% assign label = include.label | default: site.title %}<title>{% if page.title and page.title != label %}{{ page.title }} · {% endif %}{{ label }} · Everise</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="canonical" href="https://everise.dev{{ include.path }}" />
<script>
  // These pages are served at everise.dev (worker/docs.ts); GitHub Pages only builds them.
  if (location.hostname.endsWith('github.io')) location.replace('https://everise.dev{{ include.path }}');
</script>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Cinzel:600,700|Marcellus|Source+Sans+Pro:400,600,700&display=swap"
/>
<link rel="stylesheet" href="/docs/frontend/everise-docs.css" />
